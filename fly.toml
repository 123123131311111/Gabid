# Fly.io: регион Франкфурт (ближе всего к игрокам из Германии/СНГ). Деплой: fly launch --copy-config, затем fly deploy.
app = "dotasense"
primary_region = "fra"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # сервер не «засыпает» — матчи не рвутся и не надо ждать минуту на первом входе
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
