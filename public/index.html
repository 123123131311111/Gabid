<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DOTA 3v3 — HTML5 • Shadow Rampage</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#02060b;
            font-family:'Segoe UI',Arial,sans-serif;user-select:none;}
  body::before{content:'';position:fixed;inset:0;background:
    repeating-linear-gradient(135deg,rgba(146,170,190,.08),rgba(146,170,190,.08) 1px,transparent 1px,transparent 13px);
    pointer-events:none;opacity:.5;}
  canvas{display:block;cursor:crosshair;outline:none;}
  #topbar{position:fixed;top:18px;left:0;right:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 0 28px;pointer-events:none;}
  #topbar > *{pointer-events:auto;}
  .brand-block{display:flex;flex-direction:column;align-items:flex-start;}
  .brand-eyebrow{font:700 15px/1.1 'Segoe UI',Arial,sans-serif;letter-spacing:.32em;color:#d7b36a;text-transform:uppercase;opacity:.9;}
  .brand-title{margin-top:6px;line-height:.78;font-family:Georgia,'Times New Roman',serif;font-size:clamp(52px,8vw,132px);font-weight:700;letter-spacing:-.08em;color:#f0c979;text-shadow:0 0 18px rgba(240,201,121,.25),0 0 32px rgba(255,118,75,.12);text-transform:uppercase;}
  .brand-rule{width:min(100%,560px);height:4px;margin-top:10px;background:linear-gradient(90deg,#da4d42,#c44e35 55%,rgba(255,255,255,0));box-shadow:0 0 18px rgba(216,82,65,.5);}
  #online-entry{display:flex;align-items:center;justify-content:center;min-width:230px;min-height:52px;padding:12px 22px;color:#081018;font:bold 15px 'Segoe UI',Arial;background:linear-gradient(180deg,#b4eef8 0%, #a0d9ff 22%, #f7d98c 100%);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.15);cursor:pointer;letter-spacing:.06em;border-radius:4px;text-transform:uppercase;}
  #online-entry:hover{filter:brightness(1.08);}
  #mode-picker{position:fixed;inset:0;z-index:21;display:grid;place-items:center;background:rgba(3,6,12,.72);}
  #mode-picker[hidden]{display:none;}
  .mode-panel{width:min(560px,calc(100vw - 36px));box-sizing:border-box;padding:38px;text-align:center;color:#f2e2bd;background:rgba(7,12,22,.98);border:2px solid #d7b36a;box-shadow:0 22px 70px rgba(0,0,0,.7);}
  .mode-panel h1{margin:10px 0;font:700 38px Georgia,serif;}
  .mode-panel p{margin:0 0 26px;color:rgba(255,255,255,.68);}
  .mode-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;}
  .mode-actions button{min-height:52px;padding:10px 14px;color:#081018;font:bold 13px 'Segoe UI',Arial;background:linear-gradient(#8be9fd,#d7b36a);border:1px solid #fff0c7;cursor:pointer;}
  .mode-actions button:hover{filter:brightness(1.16);}
  #room-state{margin:18px 0;text-align:left;color:rgba(255,255,255,.8);font-size:12px;line-height:1.5;}
  #room-state .room-slot{display:flex;align-items:center;gap:8px;margin:5px 0;padding:7px 9px;background:rgba(139,233,253,.08);border:1px solid rgba(139,233,253,.25);}
  #room-state .room-slot strong{width:42px;color:#ffd568;}
  #room-state .room-slot select{margin-left:auto;max-width:150px;background:#101b2a;color:#fff;border:1px solid #8be9fd;padding:4px;}
  #room-state .room-slot.mine{border-color:#ffd568;}
  #room-start{display:none;width:100%;}
  @media(max-width:560px){.mode-panel{padding:28px 20px}.mode-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="topbar">
  <div class="brand-block">
    <div class="brand-eyebrow">АРЕНА ТРЁХ СИЛ • ONLINE</div>
    <div class="brand-title">DOTA SENS</div>
    <div class="brand-rule"></div>
  </div>
  <button id="online-entry" type="button">ОНЛАЙН 3 НА 3</button>
</div>
<canvas id="game" tabindex="0"></canvas>
<section id="mode-picker" hidden>
  <div class="mode-panel">
    <div>SHADOW RAMPAGE</div>
    <h1>Онлайн 3 на 3</h1>
    <p id="match-status">Нажми кнопку, чтобы создать или найти комнату.</p>
    <div id="room-state"></div>
    <div class="mode-actions">
      <button type="button" id="online-button">Найти игроков</button>
      <button type="button" id="room-start">СТАРТ МАТЧА</button>
    </div>
  </div>
</section>
<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
<script>
(() => {
  const picker = document.getElementById('mode-picker');
  const entry = document.getElementById('online-entry');
  const button = document.getElementById('online-button');
  const start = document.getElementById('room-start');
  const status = document.getElementById('match-status');
  const roomState = document.getElementById('room-state');
  let socket = null;
  let room = null;
  let started = false;
  entry.addEventListener('click', () => { picker.hidden = false; });
  button.addEventListener('click', () => {
    if(socket) return;
    button.disabled = true;
    button.textContent = 'Создание комнаты...';
    status.textContent = 'Подключение к серверу';
    socket = io();
    window.__shadowOnlineSocket = socket;
    socket.on('lobbyUpdate', next => {
      room = next;
      button.style.display = 'none';
      status.textContent = 'Комната ' + next.roomId + ' • игроков: ' + next.players.length + '/6';
      renderRoom(next);
    });
    socket.on('room:error', data => { status.textContent = data.message; start.disabled = false; });
    socket.on('room:started', () => { status.textContent = 'Матч запускается...'; start.disabled = true; });
    socket.on('match:begin', data => { started = true; window.__shadowOnlineMatch = data; canvas.focus(); });
    socket.on('connect_error', () => { status.textContent = 'Сервер недоступен'; button.disabled = false; button.textContent = 'Повторить'; socket = null; });
    socket.on('disconnect', () => { if(!started) status.textContent = 'Соединение потеряно'; });
    socket.emit('match:join');
  });
  start.addEventListener('click', () => { if(socket && room && room.players.length >= 2 && room.hostId === socket.id) socket.emit('room:start'); });

  function renderRoom(next){
    roomState.innerHTML = '';
    const title = document.createElement('div');
    title.textContent = next.players.length < 2 ? 'Нужен ещё хотя бы один игрок. Ботов в онлайн-матче нет.' : (next.hostId === socket.id ? 'Ты владелец комнаты. Можно запускать матч.' : 'Ждём старта от владельца комнаты.');
    roomState.appendChild(title);
    const selectedHeroes = new Set(next.players.map(member => member.hero).filter(Boolean));
    for(let slot=0; slot<6; slot++){
      const member = next.players.find(item => item.slot === slot);
      const row = document.createElement('div');
      row.className = 'room-slot' + (member && member.id === socket.id ? ' mine' : '');
      const label = document.createElement('strong');
      label.textContent = (slot < 3 ? 'Свет ' : 'Тьма ') + ((slot % 3) + 1);
      row.appendChild(label);
      if(member){
        const name = document.createElement('span');
        name.textContent = member.id === socket.id ? 'Ты' : 'Игрок';
        row.appendChild(name);
        if(member.id === socket.id){
          const select = document.createElement('select');
          HERO_IDS_FOR_ROOM.forEach(hero => {
            const option = document.createElement('option'); option.value = hero.id; option.textContent = hero.name;
            option.disabled = selectedHeroes.has(hero.id) && hero.id !== member.hero;
            if(hero.id === member.hero) option.selected = true;
            select.appendChild(option);
          });
          select.addEventListener('change', () => socket.emit('room:select', {heroId:select.value}));
          row.appendChild(select);
        } else row.appendChild(document.createTextNode(' • ' + (member.hero || 'выбирает героя')));
      } else {
        const take = document.createElement('button'); take.textContent = 'ЗАНЯТЬ СЛОТ';
        take.addEventListener('click', () => socket.emit('room:select', {slot}));
        row.appendChild(take);
      }
      roomState.appendChild(row);
    }
    start.style.display = next.hostId === socket.id ? 'block' : 'none';
    start.disabled = next.players.length < 2;
    start.textContent = next.players.length < 2 ? 'НУЖЕН ЕЩЁ ИГРОК' : 'СТАРТ МАТЧА';
  }

  const HERO_IDS_FOR_ROOM = [
    {id:'shadow',name:'Шадоу'},{id:'ilya',name:'Илья'},{id:'golly',name:'Голли'},
    {id:'pyro',name:'Пиромант'},{id:'warlord',name:'Вождь'},{id:'grisha',name:'Гриша'},
    {id:'sasych',name:'Сасыч'},{id:'malit',name:'Малит'},{id:'arcady',name:'Аркадий'},
    {id:'illusionist',name:'Иллюзионист'},{id:'mageHunter',name:'Охотник на магов'},
    {id:'regina',name:'Ригина'},{id:'dawnMaiden',name:'Рассветная дева'},
    {id:'exileKnight',name:'Рыцарь-изгнанник'},{id:'juggernaut',name:'Джаггернаут'},
    {id:'sniper',name:'Снайпер'},{id:'earthshaker',name:'Шмедик'},
    {id:'mo3gi',name:'Мо3ги'},{id:'tribupainer',name:'Трибупейнер'},
    {id:'juvsyut',name:'Джувсют'},{id:'chip',name:'Чип'}
  ];
})();
</script>
</body>
</html>
