<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DOTA 3v3 вЂ” HTML5 вЂў Shadow Rampage</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;
            font-family:'Segoe UI',Arial,sans-serif;user-select:none;}
  canvas{display:block;cursor:crosshair;outline:none;}
  #online-entry{position:fixed;right:24px;top:22px;z-index:20;min-width:180px;min-height:42px;padding:10px 18px;color:#081018;font:bold 13px 'Segoe UI',Arial;background:linear-gradient(#8be9fd,#d7b36a);border:1px solid #fff0c7;cursor:pointer;}
  #online-entry:hover{filter:brightness(1.16);}
  #mode-picker{position:fixed;inset:0;z-index:21;display:grid;place-items:center;background:rgba(3,6,12,.72);}
  #mode-picker[hidden]{display:none;}
  .mode-panel{width:min(560px,calc(100vw - 36px));box-sizing:border-box;padding:38px;text-align:center;color:#f2e2bd;background:rgba(7,12,22,.98);border:2px solid #d7b36a;box-shadow:0 22px 70px rgba(0,0,0,.7);}
  .mode-panel h1{margin:10px 0;font:700 38px Georgia,serif;}
  .mode-panel p{margin:0 0 26px;color:rgba(255,255,255,.68);}
  .mode-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;}
  .mode-actions button{min-height:52px;padding:10px 14px;color:#081018;font:bold 13px 'Segoe UI',Arial;background:linear-gradient(#8be9fd,#d7b36a);border:1px solid #fff0c7;cursor:pointer;}
  .mode-actions button:hover{filter:brightness(1.16);}
  #room-state{margin:18px 0;text-align:left;color:rgba(255,255,255,.8);font-size:12px;line-height:1.5;}
  #room-state .room-slot{display:flex;align-items:center;gap:8px;margin:5px 0;padding:7px 9px;background:rgba(139,233,253,.08);border:1px solid rgba(139,233,253,.25);}
  #room-state .room-slot strong{width:42px;color:#ffd568;}
  #room-state .room-slot select{margin-left:auto;max-width:150px;background:#101b2a;color:#fff;border:1px solid #8be9fd;padding:4px;}
  #room-state .room-slot.mine{border-color:#ffd568;}
  #room-start{display:none;width:100%;}
  @media(max-width:560px){.mode-panel{padding:28px 20px}.mode-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<button id="online-entry" type="button">РћРќР›РђР™Рќ 3 РќРђ 3</button>
<section id="mode-picker" hidden>
  <div class="mode-panel">
    <div>SHADOW RAMPAGE</div>
    <h1>РћРЅР»Р°Р№РЅ 3 РЅР° 3</h1>
    <p id="match-status">РќР°Р¶РјРё РєРЅРѕРїРєСѓ, С‡С‚РѕР±С‹ СЃРѕР·РґР°С‚СЊ РёР»Рё РЅР°Р№С‚Рё РєРѕРјРЅР°С‚Сѓ.</p>
    <div id="room-state"></div>
    <div class="mode-actions">
      <button type="button" id="online-button">РќР°Р№С‚Рё РёРіСЂРѕРєРѕРІ</button>
      <button type="button" id="room-start">РЎРўРђР Рў РњРђРўР§Рђ</button>
    </div>
  </div>
</section>
<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
<script>
(() => {
  const picker = document.getElementById('mode-picker');
  const entry = document.getElementById('online-entry');
  const button = document.getElementById('online-button');
  const start = document.getElementById('room-start');
  const status = document.getElementById('match-status');
  const roomState = document.getElementById('room-state');
  let socket = null;
  let room = null;
  let started = false;
  entry.addEventListener('click', () => { picker.hidden = false; });
  button.addEventListener('click', () => {
    if(socket) return;
    button.disabled = true;
    button.textContent = 'РЎРѕР·РґР°РЅРёРµ РєРѕРјРЅР°С‚С‹...';
    status.textContent = 'РџРѕРґРєР»СЋС‡РµРЅРёРµ Рє СЃРµСЂРІРµСЂСѓ';
    socket = io();
    window.__shadowOnlineSocket = socket;
    socket.on('lobbyUpdate', next => {
      room = next;
      button.style.display = 'none';
      status.textContent = 'РљРѕРјРЅР°С‚Р° ' + next.roomId + ' вЂў РёРіСЂРѕРєРѕРІ: ' + next.players.length + '/6';
      renderRoom(next);
    });
    socket.on('room:error', data => { status.textContent = data.message; start.disabled = false; });
    socket.on('room:started', () => { status.textContent = 'РњР°С‚С‡ Р·Р°РїСѓСЃРєР°РµС‚СЃСЏ...'; start.disabled = true; });
    socket.on('match:begin', data => { started = true; picker.hidden = true; window.__shadowOnlineMatch = data; canvas.focus(); });
    socket.on('connect_error', () => { status.textContent = 'РЎРµСЂРІРµСЂ РЅРµРґРѕСЃС‚СѓРїРµРЅ'; button.disabled = false; button.textContent = 'РџРѕРІС‚РѕСЂРёС‚СЊ'; socket = null; });
    socket.on('disconnect', () => { if(!started) status.textContent = 'РЎРѕРµРґРёРЅРµРЅРёРµ РїРѕС‚РµСЂСЏРЅРѕ'; });
    socket.emit('match:join');
  });
  start.addEventListener('click', () => { if(socket && room && room.hostId === socket.id) socket.emit('room:start'); });

  function renderRoom(next){
    roomState.innerHTML = '';
    const title = document.createElement('div');
    title.textContent = next.hostId === socket.id ? 'РўС‹ РІР»Р°РґРµР»РµС† РєРѕРјРЅР°С‚С‹. Р’С‹Р±РµСЂРё РіРµСЂРѕСЏ Рё РЅР°Р¶РјРё СЃС‚Р°СЂС‚.' : 'Р’С‹Р±РµСЂРё СЃРІРѕР±РѕРґРЅС‹Р№ СЃР»РѕС‚ Рё РіРµСЂРѕСЏ. Р–РґС‘Рј РІР»Р°РґРµР»СЊС†Р° РєРѕРјРЅР°С‚С‹.';
    roomState.appendChild(title);
    const selectedHeroes = new Set(next.players.map(member => member.hero).filter(Boolean));
    for(let slot=0; slot<6; slot++){
      const member = next.players.find(item => item.slot === slot);
      const row = document.createElement('div');
      row.className = 'room-slot' + (member && member.id === socket.id ? ' mine' : '');
      const label = document.createElement('strong');
      label.textContent = (slot < 3 ? 'РЎРІРµС‚ ' : 'РўСЊРјР° ') + ((slot % 3) + 1);
      row.appendChild(label);
      if(member){
        const name = document.createElement('span');
        name.textContent = member.id === socket.id ? 'РўС‹' : (member.bot ? 'Р‘РѕС‚' : 'РРіСЂРѕРє');
        row.appendChild(name);
        if(member.id === socket.id){
          const select = document.createElement('select');
          HERO_IDS_FOR_ROOM.forEach(hero => {
            const option = document.createElement('option'); option.value = hero.id; option.textContent = hero.name;
            option.disabled = selectedHeroes.has(hero.id) && hero.id !== member.hero;
            if(hero.id === member.hero) option.selected = true;
            select.appendChild(option);
          });
          select.addEventListener('change', () => socket.emit('room:select', {heroId:select.value}));
          row.appendChild(select);
        } else row.appendChild(document.createTextNode(' вЂў ' + (member.hero || 'РІС‹Р±РёСЂР°РµС‚ РіРµСЂРѕСЏ')));
      } else {
        const take = document.createElement('button'); take.textContent = 'Р—РђРќРЇРўР¬ РЎР›РћРў';
        take.addEventListener('click', () => socket.emit('room:select', {slot}));
        row.appendChild(take);
      }
      roomState.appendChild(row);
    }
    start.style.display = next.hostId === socket.id ? 'block' : 'none';
  }

  const HERO_IDS_FOR_ROOM = [
    {id:'shadow',name:'РЁР°РґРѕСѓ'},{id:'ilya',name:'РР»СЊСЏ'},{id:'golly',name:'Р“РѕР»Р»Рё'},
    {id:'pyro',name:'РџРёСЂРѕРјР°РЅС‚'},{id:'warlord',name:'Р’РѕР¶РґСЊ'},{id:'grisha',name:'Р“СЂРёС€Р°'},
    {id:'sasych',name:'РЎР°СЃС‹С‡'},{id:'malit',name:'РњР°Р»РёС‚'},{id:'arcady',name:'РђСЂРєР°РґРёР№'},
    {id:'illusionist',name:'РР»Р»СЋР·РёРѕРЅРёСЃС‚'},{id:'mageHunter',name:'РћС…РѕС‚РЅРёРє РЅР° РјР°РіРѕРІ'},
    {id:'regina',name:'Р РёРіРёРЅР°'},{id:'dawnMaiden',name:'Р Р°СЃСЃРІРµС‚РЅР°СЏ РґРµРІР°'},
    {id:'exileKnight',name:'Р С‹С†Р°СЂСЊ-РёР·РіРЅР°РЅРЅРёРє'},{id:'juggernaut',name:'Р”Р¶Р°РіРіРµСЂРЅР°СѓС‚'},
    {id:'sniper',name:'РЎРЅР°Р№РїРµСЂ'},{id:'earthshaker',name:'РЁРјРµРґРёРє'},
    {id:'mo3gi',name:'РњРѕ3РіРё'},{id:'tribupainer',name:'РўСЂРёР±СѓРїРµР№РЅРµСЂ'},
    {id:'juvsyut',name:'Р”Р¶СѓРІСЃСЋС‚'},{id:'chip',name:'Р§РёРї'}
  ];
})();
</script>
</body>
</html>
